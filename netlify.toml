[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Proxy para o n8n (evita CORS no browser em produção)
[[redirects]]
  from = "/api/n8n/*"
  to = "https://nat11106.app.n8n.cloud/:splat"
  status = 200
  force = true

# SPA — não incluir /api/* (áudio e n8n têm functions/redirects próprios)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
