[build]
  command = "npm run build"
  publish = "dist"

# Áudio temporário — function antes do fallback SPA (evita HTML no GET)
[[redirects]]
  from = "/api/audio/*"
  to = "/.netlify/functions/audio"
  status = 200
  force = true

# Proxy para o n8n (evita CORS no browser em produção)
[[redirects]]
  from = "/api/n8n/*"
  to = "https://nat11106.app.n8n.cloud/:splat"
  status = 200
  force = true

# SPA (React Router / rotas do Vite)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
