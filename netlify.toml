[build]
  command = "npm run build"
  publish = "dist"

# Áudio temporário (Netlify Function — ver netlify/functions/audio.ts)
# O path é também declarado em export const config no handler.

# Proxy para o n8n (evita CORS no browser em produção)
[[redirects]]
  from = "/api/n8n/*"
  to = "https://nat11106.app.n8n.cloud/:splat"
  status = 200
  force = true

# SPA (React Router / rotas do Vite)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
